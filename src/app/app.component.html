<ion-app class="liquid-app" [class.nav-visible]="loggedIn">
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>

  <!-- Navegación principal -->
  <nav class="liquid-nav" *ngIf="loggedIn && sesionLista" aria-label="Navegación principal">
    <a
      class="liquid-nav-item"
      routerLink="/inicio"
      routerLinkActive="nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Inicio"
    >
      <span class="nav-icon-wrap">
        <ion-icon name="home-outline"></ion-icon>
      </span>
      <span>Inicio</span>
    </a>

    <!-- Alumno -->
    <ng-container *ngIf="esAlumno">
      <a
        class="liquid-nav-item"
        routerLink="/clase"
        routerLinkActive="nav-active"
        aria-label="Clase en vivo"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="radio-outline"></ion-icon>
        </span>
        <span>Clases</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/tareas"
        routerLinkActive="nav-active"
        aria-label="Tareas"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="document-text-outline"></ion-icon>
        </span>
        <span>Tareas</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/comunidad"
        routerLinkActive="nav-active"
        aria-label="Comunidad"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="chatbubbles-outline"></ion-icon>
        </span>
        <span>Comunidad</span>
      </a>
    </ng-container>

    <!-- Docente -->
    <ng-container *ngIf="esDocente">
      <a
        class="liquid-nav-item"
        routerLink="/aula"
        routerLinkActive="nav-active"
        aria-label="Mis grupos"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="school-outline"></ion-icon>
        </span>
        <span>Grupos</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/tareas"
        routerLinkActive="nav-active"
        aria-label="Tareas"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="document-text-outline"></ion-icon>
        </span>
        <span>Tareas</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/comunidad"
        routerLinkActive="nav-active"
        aria-label="Comunidad"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="chatbubbles-outline"></ion-icon>
        </span>
        <span>Comunidad</span>
      </a>
    </ng-container>

    <!-- Tutor / Padre -->
    <ng-container *ngIf="esTutor">
      <a
        class="liquid-nav-item"
        routerLink="/tareas-hijo"
        routerLinkActive="nav-active"
        aria-label="Seguimiento de tareas"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="document-text-outline"></ion-icon>
        </span>
        <span>Seguimiento</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/comunidad"
        routerLinkActive="nav-active"
        aria-label="Comunicados"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="megaphone-outline"></ion-icon>
        </span>
        <span>Avisos</span>
      </a>

      <a
        class="liquid-nav-item"
        routerLink="/inicio"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Mis hijos"
      >
        <span class="nav-icon-wrap">
          <ion-icon name="people-outline"></ion-icon>
        </span>
        <span>Familia</span>
      </a>
    </ng-container>

    <button
      id="liquid-more-trigger"
      type="button"
      class="liquid-nav-item liquid-more"
      aria-label="Más opciones"
    >
      <span class="nav-icon-wrap">
        <ion-icon name="ellipsis-horizontal-circle-outline"></ion-icon>
      </span>
      <span>Más</span>
    </button>
  </nav>

  <!-- Panel Más -->
  <ion-popover
    *ngIf="loggedIn && sesionLista"
    trigger="liquid-more-trigger"
    triggerAction="click"
    side="top"
    alignment="end"
    show-backdrop="true"
    class="liquid-popover"
  >
    <ng-template>
      <div class="more-sheet">
        <div class="more-sheet-head">
          <div>
            <p>Fray Hub</p>
            <h2>Más opciones</h2>
          </div>
          <ion-icon name="sparkles-outline" aria-hidden="true"></ion-icon>
        </div>

        <!-- Alumno -->
        <ng-container *ngIf="esAlumno">
          <a routerLink="/materias" class="more-link">
            <ion-icon name="book-outline"></ion-icon>
            <span>Materias</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>

          <a routerLink="/actividad" class="more-link">
            <ion-icon name="rocket-outline"></ion-icon>
            <span>Actividades</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>

          <a routerLink="/herramientas" class="more-link">
            <ion-icon name="construct-outline"></ion-icon>
            <span>Herramientas</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>
        </ng-container>

        <!-- Docente -->
        <ng-container *ngIf="esDocente">
          <a routerLink="/materias" class="more-link">
            <ion-icon name="book-outline"></ion-icon>
            <span>Mis Materias</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>

          <a routerLink="/asistencia" class="more-link">
            <ion-icon name="people-circle-outline"></ion-icon>
            <span>Tomar Lista</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>

          <a routerLink="/actividad" class="more-link">
            <ion-icon name="rocket-outline"></ion-icon>
            <span>Actividades</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>

          <a routerLink="/herramientas" class="more-link">
            <ion-icon name="folder-open-outline"></ion-icon>
            <span>Material de Apoyo</span>
            <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
          </a>
        </ng-container>

        <!-- Perfil: alumno y docente -->
        <a *ngIf="!esTutor" routerLink="/perfil" class="more-link">
          <ion-icon name="person-outline"></ion-icon>
          <span>Mi Perfil</span>
          <ion-icon name="chevron-forward-outline" class="more-arrow"></ion-icon>
        </a>

        <div class="more-separator"></div>

        <button type="button" class="more-link logout-link" (click)="cerrarSesion()">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </ng-template>
  </ion-popover>
</ion-app>
